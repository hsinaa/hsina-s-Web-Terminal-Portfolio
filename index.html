<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Hasnae Amansag — DevSecOps, cloud and cybersecurity engineer.">
    <meta name="theme-color" content="#1e1e1e">
    <title>hasnae@portfolio: ~</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <main class="terminal" aria-label="Interactive Linux terminal portfolio">
        <header class="terminal-bar">
            <div class="window-controls" aria-hidden="true"><span></span><span></span><span></span></div>
            <div class="terminal-title">hasnae@portfolio: ~</div>
            <button id="clear-button" type="button" aria-label="Clear terminal">clear</button>
        </header>

        <section class="terminal-body" id="terminal-body" role="log" aria-live="polite">
            <div class="welcome">
                <p>Welcome to Hasnae's portfolio terminal.</p>
                <p>Type <strong>help</strong> to see the available commands.</p>
            </div>
            <div id="output"></div>
            <form id="command-form" class="input-line" autocomplete="off">
                <label for="user-input"><span>hasnae@portfolio</span>:~$</label>
                <input id="user-input" name="command" type="text" spellcheck="false" aria-label="Terminal command" autofocus>
            </form>
        </section>
    </main>

    <p class="footer">AMANSAG Hasnae · DevSecOps &amp; Cybersecurity</p>
    <span id="current-time" hidden></span><span id="year" hidden></span>
    <script src="script.js"></script>
</body>
</html>
